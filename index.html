<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>Moje nekretnine Konavle</title>
<style>
  html, body { margin: 0; }
  /* Layout: karta preko cijelog ekrana; popis lijevo na desktopu, donja ladica na mobitelu. */
  :root {
    --bg: #fbfaf7; --fg: #1f2420; --muted: #6a716b; --line: #e2e2dc; --hover: #f0efe9;
    --accent: #2f6d4f; --land: #c9c6b6; --chip: #ecebe4;
    --f-ui: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-num: "Source Sans 3", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #161a18; --fg: #e6e9e6; --muted: #98a19a; --line: #2a302c; --hover: #1f2522;
    --accent: #7cc4a0; --land: #3a3d36; --chip: #252b27; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #161a18; --fg: #e6e9e6; --muted: #98a19a; --line: #2a302c; --hover: #1f2522;
    --accent: #7cc4a0; --land: #3a3d36; --chip: #252b27; color-scheme: dark }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--f-ui); overflow: hidden; }
  * { box-sizing: border-box; }
  #app { position: relative; display: flex; height: 100%; }
  #side { order: -1; width: 340px; flex: none; display: flex; flex-direction: column; min-height: 0;
          border-right: 1px solid var(--line); background: var(--bg); z-index: 1000; }
  #side header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  #grab { display: none; }
  h1 { font-size: 18px; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  #q { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
       background: var(--bg); color: var(--fg); font: inherit; }
  #q:focus-visible, button:focus-visible, .it:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #list { overflow: auto; flex: 1; min-height: 0; -webkit-overflow-scrolling: touch; }
  .ko { position: sticky; top: 0; background: var(--bg); padding: 10px 16px 7px; font-weight: 600;
        font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; border-bottom: 1px solid var(--line);
        display: flex; align-items: center; gap: 8px; cursor: pointer; width: 100%; border-width: 0 0 1px; color: var(--fg); font-family: inherit; text-align: left; }
  .ko .n { color: var(--muted); font-weight: 400; margin-left: auto; letter-spacing: 0; }
  .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .it { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
        color: var(--fg); font: inherit; padding: 8px 16px 8px 35px; cursor: pointer; }
  .it:hover, .it.on { background: var(--hover); }
  .it b { font-weight: 600; }
  .m { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  #miss { padding: 10px 16px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); }
  #map { flex: 1; min-width: 0; background: var(--land); }
  .leaflet-container { font: inherit; background: var(--land); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--bg); color: var(--fg); }
  .leaflet-popup-content { font-size: 14px; line-height: 1.45; min-width: 220px; margin: 12px 16px; }
  .leaflet-popup-content h3 { margin: 0 0 4px; font-size: 16px; }
  .leaflet-popup-content .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .leaflet-popup-content a.btn { display: inline-block; padding: 6px 10px; border-radius: 6px; background: var(--accent);
        color: var(--bg); text-decoration: none; font-weight: 600; font-size: 13px; }
  .leaflet-control-zoom a, .leaflet-bar a { background: var(--bg); color: var(--fg); border-color: var(--line); }
  .leaflet-control-attribution { background: color-mix(in srgb, var(--bg) 80%, transparent) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--muted); }
  .lbl { background: none; border: none; box-shadow: none; color: #fff; font-weight: 600; font-size: 11px;
         text-shadow: 0 0 3px #000, 0 0 2px #000; padding: 0; }
  .lbl::before { display: none; }
  #layers { position: absolute; z-index: 1000; top: calc(10px + env(safe-area-inset-top, 0px));
            right: calc(10px + env(safe-area-inset-right, 0px)); display: flex; gap: 0; border-radius: 8px;
            overflow: hidden; border: 1px solid var(--line); box-shadow: 0 1px 4px rgb(0 0 0 / .2); }
  #layers button { border: 0; padding: 7px 11px; font: 600 13px var(--f-ui); background: var(--bg); color: var(--fg); cursor: pointer; }
  #layers button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  #loc { position: absolute; z-index: 1000; right: calc(10px + env(safe-area-inset-right, 0px));
         top: calc(56px + env(safe-area-inset-top, 0px)); width: 46px; height: 46px; border-radius: 50%;
         border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer;
         display: grid; place-items: center; box-shadow: 0 1px 4px rgb(0 0 0 / .25); }
  #loc[aria-pressed="true"] { color: #1a73e8; }
  #loc[aria-pressed="mixed"] { color: var(--fg); }
  #here { position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%);
          bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px);
          padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
          font: 14px var(--f-ui); box-shadow: 0 2px 8px rgb(0 0 0 / .25); cursor: pointer; text-align: center; }
  @media (min-width: 721px) { #here { left: calc(340px + (100% - 340px) / 2); } }
  @media (max-width: 720px) {
    #here { bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
    #layers button { padding: 7px 9px; }
    #side { position: absolute; left: 0; right: 0; bottom: 0; width: auto; height: 62%; border-right: 0;
            border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: 0 -4px 16px rgb(0 0 0 / .18);
            transform: translateY(calc(100% - 92px - env(safe-area-inset-bottom, 0px)));
            transition: transform .22s ease; padding-bottom: env(safe-area-inset-bottom, 0px); }
    #side.open { transform: none; }
    #side header { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 6px; }
    #grab { display: block; justify-self: center; width: 100%; height: 22px; border: 0; background: none; cursor: pointer; position: relative; }
    #grab::after { content: ""; position: absolute; left: 50%; top: 8px; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: var(--line); }
    #map { position: absolute; inset: 0; }
  }
  @media (prefers-reduced-motion: reduce) { #side { transition: none; } }
</style>
</head>

<div id="app">
  <div id="map" role="application" aria-label="Karta čestica"></div>

  </button>
  <button id="here" hidden></button>

    <header>
      <button id="grab" aria-label="Otvori ili zatvori popis"></button>

    </header>
    <div id="list"></div>
    <div id="miss"></div>
  </aside>
</div>

rties":{"ko":"ŠILJEŠKI","zkKc":"6","opis":"POD GRADINA","zk":["142"],"udio":["ZK ŠILJEŠKI 142 — 42. Suvlasnički dio: 24/41472"],"koMb":"307211","kc":"6","povrsina":2169,"color":"#469990","lat":42.576222,"lon":18.316443},"geometry":{"type":"Polygon","coordinates":[[[18.31605947,42.57614979],[18.31634002,42.57595737],[18.31639966,42.57604825],[18.31645532,42.57617799],[18.31659629,42.57613714],[18.3166992,42.57617017],[18.31679066,42.57612343],[18.31690732,42.57626896],[18.31658149,42.57654627],[18.3165216,42.57657297],[18.3161988,42.57635473],[18.31614322,42.57623201],[18.31605947,42.57614979]]]}},{"type":"Feature","properties":{"ko":"ŠILJEŠKI","zkKc":"7","opis":"POD GRADINA","zk":["142"],"udio":["ZK ŠILJEŠKI 142 — 42. Suvlasnički dio: 24/41472"],"koMb":"307211","kc":"7","povrsina":1827,"color":"#469990","lat":42.576522,"lon":18.3169},"geometry":{"type":"Polygon","coordinates":[[[18.31658149,42.57654627],[18.31690732,42.57626896],[18.31700468,42.57629091],[18.31705435,42.57629435],[18.31712709,42.57641644],[18.31717501,42.57640974],[18.31726132,42.57649165],[18.31720452,42.57662462],[18.31678282,42.57681811],[18.31694994,42.57664162],[18.31673868,42.57673707],[18.31664009,42.57667264],[18.31659362,42.57655301],[18.31658149,42.57654627]]]}},{"type":"Feature","properties":{"ko":"ŠILJEŠKI","zkKc":"8","opis":"POD GRADINA","zk":["142"],"udio":["ZK ŠILJEŠKI 142 — 42. Suvlasnički dio: 24/41472"],"koMb":"307211","kc":"8","povrsina":115,"color":"#469990","lat":42.576733,"lon":18.316803},"geometry":{"type":"Polygon","coordinates":[[[18.31673868,42.57673707],[18.31694994,42.57664162],[18.31678282,42.57681811],[18.31673868,42.57673707]]]}}],"missing":[{"ko":"KOMAJI","zkKc":"381/2","opis":"ORANICA","zk":["463"],"udio":["ZK KOMAJI 463 — 29. Suvlasnički dio: 140/24192"],"koMb":"306614","kc":"381/2"},{"ko":"SOLINE","zkKc":"ZGR. 93","opis":"KUĆA","zk":["317"],"udio":["ZK SOLINE 317 — 2. Vlasnički dio: 1/1"],"koMb":"307122","kc":"*93"},{"ko":"SOLINE","zkKc":"125/2","opis":"DVORIŠTE","zk":["317"],"udio":["ZK SOLINE 317 — 2. Vlasnički dio: 1/1"],"koMb":"307122","kc":"125/2"}]};

const map = L.map('map', { zoomControl: true, maxZoom: 20 });
const bases = {
  sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 20, maxNativeZoom: 19, attribution: 'Esri, Maxar' }),
  dof: L.tileLayer.wms('https://geoportal.dgu.hr/services/inspire/orthophoto_2019_2020/ows',
    { layers: 'OI.OrthoimageCoverage', format: 'image/jpeg', maxZoom: 20, attribution: 'Ortofoto DGU 2019/2020' }),
  osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 20, maxNativeZoom: 19, attribution: '© OpenStreetMap' }),
};
const cadastre = L.tileLayer.wms('https://api.uredjenazemlja.hr/services/inspire/cp/wms',
  { layers: 'CP.CadastralParcel', format: 'image/png', transparent: true, maxZoom: 20, minZoom: 15, attribution: 'Katastar DGU' });
let base = bases.sat.addTo(map);

const fmt = n => n == null ? '?' : n.toLocaleString('hr-HR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

const byId = new Map();
const layer = L.geoJSON(DATA, {
  style: f => ({ color: f.properties.color, weight: 2.5, fillColor: f.properties.color, fillOpacity: 0.32 }),
  onEachFeature: (f, l) => {
    const p = f.properties, id = p.koMb + '-' + p.kc;
    byId.set(id, l);
    l.bindPopup(() => `
      <h3>k.č. ${esc(p.zkKc)}</h3>
      <div><b>KO ${esc(p.ko)}</b> <span class="m">${esc(p.koMb)}</span></div>
      ${p.opis ? `<div>${esc(p.opis)}</div>` : ''}
      <div>Površina: <b>${fmt(p.povrsina)} m²</b></div>
      <div>ZK uložak: ${p.zk.map(esc).join(', ')}</div>
      ${p.udio.length ? `<div class="m" style="margin-top:4px">${p.udio.map(esc).join('<br>')}</div>` : ''}
      <div class="row">
        <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}">Google Maps</a>
        <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}">Navigacija</a>
      </div>`, { autoPanPaddingTopLeft: [10, 60], autoPanPaddingBottomRight: [10, 110] });
    l.bindTooltip(esc(p.kc), { permanent: true, direction: 'center', className: 'lbl' });
    l.on('click', () => select(id, false));
  }
}).addTo(map);
map.fitBounds(layer.getBounds(), { padding: [20, 20] });

const syncLabels = () => layer.eachLayer(l => { const t = l.getTooltip(); if (t) t.setOpacity(map.getZoom() >= 16 ? 1 : 0); });
map.on('zoomend', syncLabels); syncLabels();
L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

document.querySelectorAll('#layers [data-base]').forEach(b => b.onclick = () => {
  map.removeLayer(base); base = bases[b.dataset.base].addTo(map); base.bringToBack();
  document.querySelectorAll('#layers [data-base]').forEach(x => x.setAttribute('aria-pressed', x === b));
});
const bCad = document.getElementById('l-cad');
bCad.onclick = () => {
  const on = !map.hasLayer(cadastre);
  if (on) cadastre.addTo(map); else map.removeLayer(cadastre);
  bCad.setAttribute('aria-pressed', on);
};

// Moja lokacija uživo: plava točka + krug točnosti, i na kojoj sam čestici.
const me = L.layerGroup().addTo(map);
const meDot = L.circleMarker([0, 0], { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 });
const meAcc = L.circle([0, 0], { radius: 1, color: '#1a73e8', weight: 1, fillColor: '#1a73e8', fillOpacity: 0.12, interactive: false });
const here = document.getElementById('here'), bLoc = document.getElementById('loc');
let watchId = null, follow = false, lastFix = null;

function inRing(pt, ring) {
  let ins = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}
function parcelAt(lon, lat) {
  for (const f of feats) {
    const g = f.geometry, polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
    if (polys.some(p => inRing([lon, lat], p[0]) && !p.slice(1).some(h => inRing([lon, lat], h)))) return f.properties;
  }
  return null;
}
function onFix(pos) {
  const { latitude: lat, longitude: lon, accuracy } = pos.coords;
  const first = !lastFix;
  lastFix = [lat, lon];
  meDot.setLatLng(lastFix); meAcc.setLatLng(lastFix).setRadius(accuracy);
  if (!me.hasLayer(meDot)) { me.addLayer(meAcc); me.addLayer(meDot); }
  if (first || follow) map.setView(lastFix, first ? Math.max(map.getZoom(), 17) : map.getZoom());
  const p = parcelAt(lon, lat);
  here.hidden = false;
  here.innerHTML = p
    ? `Nalaziš se na <b>k.č. ${esc(p.zkKc)}</b>, KO ${esc(p.ko)} <span class="m">(±${Math.round(accuracy)} m)</span>`
    : `Nisi na svojoj čestici <span class="m">(±${Math.round(accuracy)} m)</span>`;
  here.dataset.id = p ? p.koMb + '-' + p.kc : '';
}
function onErr(e) {
  here.hidden = false;
  here.textContent = e.code === 1
    ? 'Lokacija je blokirana. Dopusti pristup lokaciji u postavkama preglednika.'
    : 'Lokacija trenutno nije dostupna. Provjeri je li GPS uključen.';
  stopLoc();
}
function stopLoc() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null; follow = false; bLoc.setAttribute('aria-pressed', false);
}
bLoc.onclick = () => {
  if (!('geolocation' in navigator)) return onErr({ code: 2 });
  if (watchId === null) {
    watchId = navigator.geolocation.watchPosition(onFix, onErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    follow = true; bLoc.setAttribute('aria-pressed', true);
  } else if (!follow) {
    follow = true; bLoc.setAttribute('aria-pressed', true);
    if (lastFix) map.setView(lastFix, Math.max(map.getZoom(), 17));
  } else {
    stopLoc(); me.clearLayers(); here.hidden = true; lastFix = null;
  }
};
map.on('dragstart', () => { if (follow) { follow = false; bLoc.setAttribute('aria-pressed', 'mixed'); } });
here.onclick = () => { if (here.dataset.id) select(here.dataset.id); };

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

const feats = DATA.features;
const total = feats.reduce((a, f) => a + (f.properties.povrsina || 0), 0);
document.getElementById('sum').textContent =
  `${feats.length} čestica · ${new Set(feats.map(f => f.properties.ko)).size} KO · ${fmt(total)} m² (cijele čestice)`;
if (DATA.missing && DATA.missing.length)
  document.getElementById('miss').textContent = 'Nisu nađene u katastru: ' +
    DATA.missing.map(m => `${m.ko} ${m.zkKc} (ZK ${m.zk.join(', ')})`).join('; ');

const list = document.getElementById('list');
function render(q) {
  q = q.trim().toLowerCase();
  const groups = {};
  for (const f of feats) {
    const p = f.properties;
    const hay = [p.ko, p.kc, p.zkKc, p.opis, ...p.zk.map(z => 'zk ' + z)].join(' ').toLowerCase();
    if (q && !hay.includes(q)) continue;
    (groups[p.ko] ||= []).push(p);
  }
  list.innerHTML = Object.entries(groups).map(([ko, ps]) => `
    <button class="ko" data-ko="${esc(ko)}"><span class="sw" style="background:${ps[0].color}"></span>${esc(ko)}<span class="n">${ps.length}</span></button>
    ${ps.map(p => `<button class="it" data-id="${esc(p.koMb + '-' + p.kc)}"><b>k.č. ${esc(p.zkKc)}</b> <span class="m">${esc(p.opis)}</span><br>
      <span class="m">${fmt(p.povrsina)} m² · ZK ${p.zk.map(esc).join(', ')}</span></button>`).join('')}`).join('')
    || '<div class="m" style="padding:14px 16px">Nema čestica za taj upit.</div>';
}
render('');
document.getElementById('q').addEventListener('input', e => render(e.target.value));

const side = document.getElementById('side');
const mobile = () => matchMedia('(max-width: 720px)').matches;
function select(id, fly = true) {
  list.querySelectorAll('.it.on').forEach(e => e.classList.remove('on'));
  const row = list.querySelector(`.it[data-id="${CSS.escape(id)}"]`);
  if (row) { row.classList.add('on'); if (!fly && !mobile()) row.scrollIntoView({ block: 'nearest' }); }
  const l = byId.get(id);
  if (fly && l) { map.fitBounds(l.getBounds(), { maxZoom: 18, padding: [40, 40] }); l.openPopup(); }
}
list.addEventListener('click', e => {
  const it = e.target.closest('.it');
  if (it) { if (mobile()) side.classList.remove('open'); select(it.dataset.id); return; }
  const ko = e.target.closest('.ko');
  if (ko) {
    if (mobile()) side.classList.remove('open');
    const ls = feats.filter(f => f.properties.ko === ko.dataset.ko).map(f => byId.get(f.properties.koMb + '-' + f.properties.kc));
    map.fitBounds(L.featureGroup(ls).getBounds(), { padding: [30, 30], maxZoom: 18 });
  }
});
document.getElementById('grab').addEventListener('click', () => side.classList.toggle('open'));
document.getElementById('q').addEventListener('focus', () => { if (mobile()) side.classList.add('open'); });
</script>
